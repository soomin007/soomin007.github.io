<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soomin007의 게임</title>
<meta name="description" content="설치 없이 브라우저에서 바로 플레이할 수 있는 게임 모음입니다.">

<meta property="og:type" content="website">
<meta property="og:title" content="soomin007의 게임">
<meta property="og:description" content="설치 없이 브라우저에서 바로 플레이할 수 있는 게임 모음입니다.">
<meta property="og:image" content="https://soomin007.github.io/og.png">
<meta property="og:url" content="https://soomin007.github.io/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 홈: 목록 -->
<div id="home" class="home">
  <header class="bar">
    <div class="bar__brand">
      <span class="bar__name">soomin007</span>
      <span class="bar__tag" id="brandTag">직접 만든 무료 게임</span>
    </div>
    <nav class="bar__nav" aria-label="외부 링크">
      <a href="https://github.com/soomin007" target="_blank" rel="noopener">GitHub</a>
      <a href="https://soominsnu.itch.io" target="_blank" rel="noopener">itch.io</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="feat" id="feat" aria-roledescription="캐러셀" aria-label="추천 게임">
      <!-- app.js 가 채운다 -->
    </section>
    <div class="dots" id="dots"></div>

    <section class="ask" id="ask" aria-label="시간에 맞춰 고르기">
      <div class="ask__head">
        <span class="ask__q">몇 분 있으세요?</span>
        <span class="ask__note" id="askNote"></span>
      </div>
      <div class="ask__opts">
        <button type="button" data-time="5" aria-pressed="false">5분</button>
        <button type="button" data-time="15" aria-pressed="false">15분</button>
        <button type="button" data-time="30" aria-pressed="false">30분 이상</button>
      </div>
    </section>

    <!-- 섬 지도 입구: 같은 게임들을 3D 섬으로 본다 -->
    <a class="isle" href="world/">
      <img class="isle__art" src="assets/island.webp" alt="게임마다 땅이 하나씩 있는 육각 섬" width="800" height="450" loading="lazy">
      <span class="isle__text">
        <span class="isle__title">게임들이 사는 섬</span>
        <span class="isle__line">게임마다 땅이 하나씩 있습니다. <span class="nw">가고 싶은 땅을</span> 누르면 말이 <span class="nw">그 게임까지</span> <span class="nw">뛰어갑니다.</span></span>
      </span>
      <span class="isle__go">섬으로 가기<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
    </a>

    <div class="rowhead">
      <h2 class="rowhead__title">전체 게임</h2>
      <span class="rowhead__note" id="orderNote"></span>
    </div>
    <div class="grid" id="grid"><!-- app.js 가 채운다 --></div>
  </main>

  <footer class="foot">
    <span>© 2026 soomin007</span>
  </footer>
</div>

<!-- 상세: 게임 테마 소개 (app.js 가 채운다) -->
<div id="detail" hidden></div>

<script src="games.js"></script>
<script src="app.js"></script>
<script src="timepick.js"></script>
</body>
</html>
