<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무엇을 할까? · soomin007</title>
<meta name="description" content="가진 시간과 기기만 알려 주시면 지금 해 볼 게임 하나를 골라 드립니다.">

<meta property="og:type" content="website">
<meta property="og:title" content="무엇을 할까? · soomin007">
<meta property="og:description" content="가진 시간과 기기만 알려 주시면 지금 해 볼 게임 하나를 골라 드립니다.">
<meta property="og:image" content="https://soomin007.github.io/og.png">
<meta property="og:url" content="https://soomin007.github.io/pick/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="../icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
/* ============================================================
   무엇을 할까? · 허브 위에 올린 추천 페이지 한 장.
   질문 두 개(시간 · 기기)에 답하면 게임 하나를 권한다.
   팔레트는 허브 홈(styles.css)과 같은 다크 베이스.
   결과 카드의 강조색(--c)은 추천된 게임의 color 를 JS 가 넣는다.
   ============================================================ */

:root {
  --bg: #0b0c0f;
  --ink: #e9e7e2;
  --mut: #a5a29b;
  --dim: #7d7a74;
  --card: #14161c;
  --line: rgba(255, 255, 255, 0.08);
  --pad: 20px;
  --c: #e9e7e2;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { overflow-x: clip; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: break-word;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
img { max-width: 100%; display: block; }

a:focus-visible, button:focus-visible {
  outline: 2px solid #8ab8ff;
  outline-offset: 2px;
  border-radius: 6px;
}

.nw { white-space: nowrap; }

/* 좌우 여백은 여기서만 정한다. 이 클래스를 단 요소에 padding 단축 속성 금지 */
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: var(--pad);
  padding-right: var(--pad);
}

.top {
  padding-top: 20px;
  padding-bottom: 20px;
  font-size: 14px;
  color: var(--mut);
}
.top a:hover { color: var(--ink); }

.head {
  padding-top: 4vh;
  padding-bottom: 28px;
}
.head h1 {
  font-size: clamp(28px, 7vw, 40px);
  line-height: 1.25;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.head p {
  margin-top: 10px;
  color: var(--mut);
  font-size: 16px;
}

/* 질문 */
.q { margin-bottom: 28px; border: 0; }
.q legend {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 12px;
}
.q__opts {
  display: grid;
  grid-template-columns: repeat(var(--n, 3), 1fr);
  gap: 8px;
}
.q button {
  min-height: 52px;
  padding-left: 8px;
  padding-right: 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.q button:hover { border-color: rgba(255, 255, 255, 0.25); }
.q button[aria-pressed="true"] {
  border-color: var(--ink);
  background: #232631;
}

/* 결과 */
.result {
  margin-top: 8px;
  margin-bottom: 48px;
  border: 1px solid var(--line);
  border-top: 3px solid var(--c);
  border-radius: 14px;
  background: var(--card);
  overflow: hidden;
  animation: rise 0.35s ease;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .result { animation: none; }
}

.result__img { width: 100%; aspect-ratio: 1680 / 800; object-fit: cover; }
.result__body { padding: 20px; }
.result__label { font-size: 13px; color: var(--dim); }
.result__kicker { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--c); }
.result__title { font-size: 24px; line-height: 1.3; font-weight: 800; }
.result__why { margin-top: 10px; color: var(--mut); }
.result__tip {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
  font-weight: 600;
}
.result__tip::before { content: "권하는 분량 · "; color: var(--dim); font-weight: 500; }

.result__acts { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding-left: 22px;
  padding-right: 22px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 16px;
}
.btn--go { background: var(--c); color: #0b0c0f; flex: 1 1 auto; }
.btn--sub { border: 1px solid var(--line); color: var(--mut); }
.btn--sub:hover { color: var(--ink); }

.foot {
  padding-top: 24px;
  padding-bottom: 40px;
  font-size: 13px;
  color: var(--dim);
}
</style>
</head>
<body>

<header class="top wrap">
  <a href="../">← 전체 게임</a>
</header>

<main class="wrap">
  <section class="head">
    <h1>무엇을 할까?</h1>
    <p>가진 시간과 기기만 알려 주시면 <span class="nw">게임 하나를</span> <span class="nw">골라 드립니다.</span></p>
  </section>

  <fieldset class="q" data-key="time">
    <legend>시간이 얼마나 있으세요?</legend>
    <div class="q__opts" style="--n: 3">
      <button type="button" data-value="5" aria-pressed="false">5분</button>
      <button type="button" data-value="15" aria-pressed="false">15분</button>
      <button type="button" data-value="30" aria-pressed="false">30분 이상</button>
    </div>
  </fieldset>

  <fieldset class="q" data-key="device">
    <legend>지금 무엇으로 보고 계세요?</legend>
    <div class="q__opts" style="--n: 2">
      <button type="button" data-value="phone" aria-pressed="false">폰</button>
      <button type="button" data-value="pc" aria-pressed="false">PC</button>
    </div>
  </fieldset>

  <section class="result" id="result" hidden aria-live="polite">
    <img class="result__img" id="rImg" alt="">
    <div class="result__body">
      <div class="result__label">지금이라면 이 게임</div>
      <div class="result__kicker" id="rKicker"></div>
      <h2 class="result__title" id="rTitle"></h2>
      <p class="result__why" id="rWhy"></p>
      <p class="result__tip" id="rTip"></p>
      <div class="result__acts">
        <a class="btn btn--go" id="rPlay" target="_blank" rel="noopener">바로 하기</a>
        <a class="btn btn--sub" id="rAbout">소개 보기</a>
      </div>
    </div>
  </section>
</main>

<footer class="foot wrap">
  모든 게임은 설치 없이 브라우저에서 <span class="nw">바로 열립니다.</span>
</footer>

<script src="../games.js"></script>
<script src="pick.js"></script>
</body>
</html>
