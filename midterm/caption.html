<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캡션 카드 · Be the Bee 만든 기록</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* 중간 과제 캡션 카드. 인쇄하면 A6 가로(148 x 105mm) 한 장, 화면에서는 가운데 카드 */
:root {
  --ink: #241a06;
  --ink-soft: #5a4a28;
  --mut: #8a7a55;
  --honey: #d2a230;
  --honey-hot: #F0B429;
  --card: #fffdf6;
  --sans: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #f4ead0;
  color: var(--ink);
  font-family: var(--sans);
  word-break: keep-all;
  overflow-wrap: break-word;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 20px;
}
.nw { white-space: nowrap; }
.card {
  width: 100%;
  max-width: 600px;
  background: var(--card);
  border: 2.5px solid #3a2c10;
  border-radius: 18px;
  box-shadow: 0 6px 0 rgba(58, 44, 16, 0.9);
  padding: 26px 26px 22px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 18px 22px;
}
.card__head { grid-column: 1 / -1; }
.card__kicker { font-size: 12px; font-weight: 900; letter-spacing: 0.14em; color: var(--honey); }
.card__title { font-size: 30px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; margin-top: 4px; }
.card__name { font-size: 14px; font-weight: 700; color: var(--ink-soft); margin-top: 6px; }
.card__label { font-size: 11.5px; font-weight: 900; letter-spacing: 0.1em; color: var(--mut); margin-bottom: 4px; }
.card__q { font-size: 17px; font-weight: 800; line-height: 1.55; }
.card__do { font-size: 15px; color: var(--ink-soft); line-height: 1.7; margin-top: 14px; }
.card__qr { align-self: end; text-align: center; }
.card__qr #qr { width: 116px; height: 116px; background: #fff; padding: 6px; border-radius: 8px; border: 1.5px solid rgba(90, 58, 20, 0.18); }
.card__qr #qr img, .card__qr #qr canvas { width: 100% !important; height: 100% !important; }
.card__url { font-size: 11px; color: var(--mut); margin-top: 6px; }

@media (max-width: 520px) {
  .card { grid-template-columns: 1fr; padding: 22px 20px 20px; }
  .card__title { font-size: 26px; }
  .card__qr { justify-self: start; text-align: left; }
}

@page { size: 148mm 105mm; margin: 0; }
@media print {
  body { background: #fff; padding: 0; min-height: 0; display: block; }
  .card {
    width: 148mm;
    height: 105mm;
    max-width: none;
    border-radius: 0;
    box-shadow: none;
    border: 0;
    padding: 9mm 10mm 8mm;
    grid-template-columns: 1fr auto;
  }
  .card__title { font-size: 24pt; }
}
</style>
</head>
<body>
<article class="card">
  <header class="card__head">
    <p class="card__kicker">THINGS WE CHOSE TO MAKE</p>
    <h1 class="card__title">Be the Bee <span class="nw">만든 기록</span></h1>
    <p class="card__name">김수민 · 웹프로그래밍개론 중간 과제</p>
  </header>
  <div>
    <p class="card__label">질문</p>
    <p class="card__q">게임이 만들어진 과정을 보여 주면, <span class="nw">처음 온 사람이</span> <span class="nw">그 게임을</span> <span class="nw">해 보고 싶어질까?</span></p>
    <p class="card__do">QR로 소개 페이지를 열고 <span class="nw">"만든 기록"에서</span> <span class="nw">한 항목만</span> <span class="nw">읽어 보세요.</span> 그다음 "바로 플레이"를 누르고 싶어졌는지가 <span class="nw">이 작품의 답입니다.</span></p>
  </div>
  <div class="card__qr">
    <div id="qr" role="img" aria-label="Be the Bee 만든 기록 페이지로 가는 QR 코드"></div>
    <p class="card__url">soomin007.github.io/g/be-the-bee</p>
  </div>
</article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  "use strict";
  var box = document.getElementById("qr");
  if (!window.QRCode) {
    box.textContent = "QR 로딩 실패";
    return;
  }
  new QRCode(box, {
    text: "https://soomin007.github.io/g/be-the-bee/#devlog",
    width: 256,
    height: 256,
    colorDark: "#241a06",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
})();
</script>
</body>
</html>
